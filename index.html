<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Zapdos Live Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&display=swap">
<style>
  /*
    1920x1080 transparent stage.
    Bottom band (y 818-1080):
      - eyes video loops across the left/middle (x 0-1560)
      - "ZAPDOS IS LIVE" sits in the small space at the right (x 1560-1920)
  */
  :root {
    --ink: #0a0a0a;
    --paper: #f5f5f2;
    --red: #ff1f2d;
    --blue: #2f7bff;
    --display: "Bangers", "Impact", sans-serif;
    --label: "Anton", "Impact", sans-serif;
    --band-y: 818px;
    --band-h: 262px;
    --video-w: 1560px;
    --video-h: 400px;
  }
  html, body { margin: 0; padding: 0; background: transparent !important; width: 100%; height: 100%; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; background: transparent; }

  .band {
    position: absolute; left: 0; top: var(--band-y);
    width: 1920px; height: var(--band-h);
    background: var(--ink);
    overflow: hidden;
  }
  .band canvas.eyes {
    /* Slightly taller than the band and gently stretched so the whole eye (close/open) stays in view. */
    position: absolute; left: 0; top: calc((var(--band-h) - var(--video-h)) / 2);
    width: var(--video-w); height: var(--video-h);
    object-fit: fill;
    background: var(--ink);
  }

  .tag {
    position: absolute; left: var(--video-w); top: 0;
    width: calc(1920px - var(--video-w)); height: var(--band-h);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0;
  }
  .name {
    font-family: var(--display); font-size: 92px; line-height: .9; letter-spacing: 2px;
    color: var(--paper);
    -webkit-text-stroke: 6px var(--ink); paint-order: stroke fill;
    text-shadow: 5px 5px 0 var(--red);
    animation: glitch 5s 2s infinite steps(1);
  }
  .live {
    display: flex; align-items: center; gap: 12px; margin-top: 6px;
    background: var(--paper); color: var(--ink);
    font-family: var(--label); font-size: 34px; letter-spacing: 4px; text-transform: uppercase;
    padding: 5px 22px 5px 15px;
    clip-path: polygon(0 12%, 4% 0, 12% 8%, 22% 0, 36% 6%, 52% 0, 70% 8%, 86% 0, 96% 6%, 100% 0, 100% 92%, 94% 100%, 80% 92%, 62% 100%, 44% 93%, 28% 100%, 12% 92%, 4% 100%, 0 90%);
  }
  .dot { width: 18px; height: 18px; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 0 rgba(255,31,45,.8); animation: pulse 1.3s infinite; }

  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,31,45,.8); } 70% { box-shadow: 0 0 0 14px rgba(255,31,45,0); } 100% { box-shadow: 0 0 0 0 rgba(255,31,45,0); } }
  @keyframes glitch {
    0%, 94%, 100% { transform: none; text-shadow: 5px 5px 0 var(--red); }
    95% { transform: translate(-5px, 2px); text-shadow: 9px 0 0 var(--red), -7px 0 0 var(--blue); }
    97% { transform: translate(4px, -2px); text-shadow: -9px 0 0 var(--red), 7px 0 0 var(--blue); }
    98% { transform: none; text-shadow: 5px 5px 0 var(--red); }
  }
  @media (prefers-reduced-motion: reduce) { .name, .dot { animation: none; } }
</style>
</head>
<body>

<div id="stage">
  <div class="band">
    <!-- Eyes loop is drawn frame-by-frame from JPGs (time-based), because live-stream capture freezes <video> and animated images. -->
    <canvas class="eyes" id="eyes" width="720" height="230"></canvas>
    <div id="dbg" style="position:absolute;left:8px;top:8px;color:#0f0;font:28px monospace;display:none"></div>
    <div class="tag">
      <div class="name">Zapdos</div>
      <div class="live"><span class="dot"></span>Is Live</div>
    </div>
  </div>
</div>

<script>
  (function () {
    var s = document.getElementById("stage");
    function fit() {
      var k = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
      s.style.transform = "scale(" + k + ")";
    }
    fit(); window.addEventListener("resize", fit);

    // ---- Eyes loop: JPG frame sequence drawn on a canvas, picked by wall-clock time ----
    var N = 149, FPS = 10;
    var cv = document.getElementById("eyes"), ctx = cv.getContext("2d");
    var dbg = document.getElementById("dbg");
    var showDbg = /[?&]debug/.test(location.search);
    if (showDbg) dbg.style.display = "block";
    var frames = [], loaded = 0, last = -1, t0 = Date.now();
    function pad(n) { return ("00" + n).slice(-3); }
    for (var i = 0; i < N; i++) {
      (function (i) {
        var im = new Image();
        im.onload = function () { loaded++; };
        im.src = "frames/f" + pad(i + 1) + ".jpg";
        frames[i] = im;
      })(i);
    }
    function tick() {
      var i = Math.floor((Date.now() - t0) / (1000 / FPS)) % N;
      var im = frames[i];
      if (im && im.complete && im.naturalWidth) { ctx.drawImage(im, 0, 0, cv.width, cv.height); last = i; }
      else if (last >= 0) { /* keep previous frame until this one has loaded */ }
      if (showDbg) dbg.textContent = "frame " + i + "/" + N + "  loaded " + loaded;
    }
    tick();
    setInterval(tick, 50);
  })();
</script>

</body>
</html>
